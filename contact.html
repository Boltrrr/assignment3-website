<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISO-CORE | Contact</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <nav aria-label="Main navigation">
        <a href="index.html" class="logo">
          <img src="images/logo.png" alt="ISO-CORE logo" />
        </a>

        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h1>Contact</h1>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
      </section>

      <section>
        <h2>Contact Form</h2>

        <!-- AI-assisted: Used ChatGPT to help with this form structure -->
        <form action="contact.html" method="get">
          <div>
            <label for="full-name">Full Name</label>
            <input id="full-name" name="full-name" type="text" required />
          </div>

          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
          </div>

          <div>
            <label for="topic">Topic</label>
            <select id="topic" name="topic">
              <option value="general">General</option>
              <option value="quote">Request a quote</option>
              <option value="support">Support</option>
            </select>
          </div>

          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>

          <button type="submit">Submit</button>
        </form>
      </section>
    </main>

    <footer>
      <p>Copyright 2026 ISO-CORE | Developed by JohnBrx</p>
    </footer>
  </body>
</html>
