<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISO-CORE | Home</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <nav aria-label="Main navigation">
        <a href="index.html" class="logo">
          <img src="images/logo.png" alt="ISO-CORE logo" />
        </a>

        <button class="nav-toggle" aria-label="Open navigation menu">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <ul class="nav-links">
          <li><a href="index.html" aria-current="page">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="hero-content">
          <h1>ISO-CORE</h1>
          <p>
            Coming 2026! An indie open-world isometric game featuring
            exploration, farming, and crafting.
          </p>
        </div>
      </section>

      <section>
        <h2>Game Features</h2>

        <div class="feature-controls">
          <div class="filter-buttons">
            <button class="filter-btn active" data-category="All">All</button>
            <button class="filter-btn" data-category="Exploration">
              Exploration
            </button>
            <button class="filter-btn" data-category="Crafting">
              Crafting
            </button>
            <button class="filter-btn" data-category="Combat">Combat</button>
            <button class="filter-btn" data-category="Survival">
              Survival
            </button>
          </div>

          <input
            type="text"
            id="feature-search"
            placeholder="Search features..."
            aria-label="Search game features"
          />
        </div>

        <div id="feature-list" class="grid-3"></div>
      </section>
    </main>

    <footer>
      <p>Copyright 2026 ISO-CORE | Developed by JohnBrx</p>
    </footer>

    <button id="back-to-top" aria-label="Back to top">
      <img src="images/back-to-top.png" alt="" />
    </button>

    <script src="script.js"></script>
  </body>
</html>
